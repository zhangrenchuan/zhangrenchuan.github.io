<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151a">
<title>我的服务</title>
<style>
  :root { color-scheme: dark; font: 100%/1.6 system-ui, "PingFang SC", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; color: #eff5f6; background: radial-gradient(ellipse at 80% 0%, #1b3033 0%, transparent 54%), #10151a; }
  main { max-width: 64rem; margin: auto; padding: clamp(4rem, 12vh, 9rem) clamp(1.25rem, 6vw, 4rem) 4rem; }
  h1 { margin: 0; font-size: clamp(2.75rem, 8vw, 5.25rem); line-height: 1.12; letter-spacing: -.055em; }
  header p { margin: 1.25rem 0 0; color: #aabdc0; }
  ul { margin: 3.5rem 0 0; padding: 1.5rem 0 0; border-top: 1px solid #324447; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
  a { display: flex; align-items: center; gap: 1rem; width: 100%; min-height: 7rem; padding: 1.25rem; color: inherit; text-decoration: none; background: #172126; border: 1px solid #36484a; border-radius: 1rem; transition: background .18s, border-color .18s; }
  a:hover { background: #1e2d31; border-color: #72bdaf; }
  a:focus-visible { outline: 3px solid #a0eadc; outline-offset: 4px; }
  .icon { display: grid; flex: 0 0 3rem; height: 3rem; place-items: center; background: #243b3d; color: #a0eadc; border-radius: .75rem; }
  .bars { display: flex; align-items: end; gap: 4px; }
  .bars i { width: 4px; background: currentColor; border-radius: 1px; }
  .bars i:nth-child(1) { height: 8px; }
  .bars i:nth-child(2) { height: 16px; }
  .bars i:nth-child(3) { height: 12px; }
  strong, .address { display: block; }
  strong { font-size: 1.2rem; }
  .address { color: #aabdc0; font: .9rem/1.6 ui-monospace, monospace; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>我的服务</h1>
    <p>请在可以访问 <code>.mac</code> 地址的设备上使用。</p>
  </header>
  <ul aria-label="服务入口">
    <li><a href="http://status.mac/">
      <span class="icon" aria-hidden="true"><span class="bars"><i></i><i></i><i></i></span></span>
      <span><strong>服务状态</strong><span class="address">status.mac</span></span>
    </a></li>
  </ul>
</main>
</body>
</html>
